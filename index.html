<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大王的 GitHub 工作空间</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); margin-top: 8px; font-size: 1rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .card .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .card .label { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .chart-box { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); }
    .chart-box h2 { font-size: 1rem; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
    .chart { height: 300px; }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 20px; }
    @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>大王的 GitHub 工作空间</h1>
      <p>由 WorkBuddy（小沃）一键部署到 GitHub Pages</p>
    </header>

    <div class="cards">
      <div class="card">
        <div class="num">1</div>
        <div class="label">公开仓库</div>
      </div>
      <div class="card">
        <div class="num">3</div>
        <div class="label">已推送文件</div>
      </div>
      <div class="card">
        <div class="num">SSH</div>
        <div class="label">传输协议</div>
      </div>
      <div class="card">
        <div class="num">✓</div>
        <div class="label">Pages 已上线</div>
      </div>
    </div>

    <div class="charts">
      <div class="chart-box">
        <h2>本周提交趋势</h2>
        <div id="commitChart" class="chart"></div>
      </div>
      <div class="chart-box">
        <h2>技术栈占比</h2>
        <div id="stackChart" class="chart"></div>
      </div>
    </div>

    <footer>Powered by GitHub Pages · ECharts · WorkBuddy ⚡</footer>
  </div>

  <script>
    // 提交趋势图
    const commitChart = echarts.init(document.getElementById('commitChart'));
    commitChart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 40, right: 20, top: 20, bottom: 30 },
      xAxis: { type: 'category', data: ['周一','周二','周三','周四','周五','周六','周日'], axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8' } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8' } },
      series: [{
        type: 'line',
        data: [0, 0, 1, 0, 0, 0, 0],
        smooth: true,
        lineStyle: { color: '#38bdf8', width: 3 },
        itemStyle: { color: '#38bdf8' },
        areaStyle: { color: 'rgba(56,189,248,0.15)' }
      }]
    });

    // 技术栈饼图
    const stackChart = echarts.init(document.getElementById('stackChart'));
    stackChart.setOption({
      backgroundColor: 'transparent',
      tooltip: { trigger: 'item' },
      series: [{
        type: 'pie',
        radius: ['45%', '70%'],
        itemStyle: { borderRadius: 8, borderColor: '#1e293b', borderWidth: 2 },
        label: { color: '#94a3b8' },
        data: [
          { value: 45, name: 'Python', itemStyle: { color: '#38bdf8' } },
          { value: 35, name: 'JavaScript', itemStyle: { color: '#818cf8' } },
          { value: 20, name: 'Markdown', itemStyle: { color: '#34d399' } }
        ]
      }]
    });

    window.addEventListener('resize', () => {
      commitChart.resize();
      stackChart.resize();
    });
  </script>
</body>
</html>
